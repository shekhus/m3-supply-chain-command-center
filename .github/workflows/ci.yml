# CI (docs/plan.md §1.4 criterion 3): lint, tests and the deterministic evaluations on every push and
# pull request. The deploy job runs only after all of it is green, only on main, and only when Railway is
# configured (repository variable RAILWAY_DEPLOY=true).
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: m3
          POSTGRES_PASSWORD: m3
          POSTGRES_DB: m3cc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U m3 -d m3cc"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://m3:m3@localhost:5432/m3cc
      REQUIRE_POSTGRES: "1"          # a missing database fails the build instead of skipping tests (D-009)
      LLM_PROVIDER: none             # no model calls in CI: narration evals come from saved runs
      JIRA_MODE: mock
      API_KEYS: viewer:ci-viewer,analyst:ci-analyst,owner:ci-owner
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.1.0  # this action publishes no floating major tag
        with:
          python-version: "3.12"
          activate-environment: true
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Install
        run: uv pip install -r pyproject.toml --extra dev

      - name: Lint (ruff + mypy)
        run: python scripts/lint.py

      - name: Generate gold with seeded anomalies (deterministic; data/ is not committed)
        if: hashFiles('synth/generate_gold.py') != ''   # lands with the generator (week 6)
        run: python -m synth.generate_gold --out data --clean

      - name: Tests
        run: python -m pytest -p no:cacheprovider

      - name: Replay and deterministic evals (strict)
        if: hashFiles('evals/run_evals.py') != ''       # lands with the replay harness (week 7)
        run: python evals/run_evals.py --strict

      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-report
          path: |
            evals/REPORT.md
            evals/results/*.json
          if-no-files-found: ignore

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.RAILWAY_DEPLOY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v7

      - name: Deploy app and portal to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          npm install --global @railway/cli@4.36.1
          # --ci streams the build and exits non-zero if it fails, so a broken image fails this job
          railway up --service app --ci
          railway up --service console --ci
