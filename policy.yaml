# Policy (plan §3.4, CLAUDE.md principle 4). Thresholds, seasonality and what may be done about each kind of
# anomaly. Enforced in code — detect/threshold.py reads the thresholds, act/policy_gate.py reads the allowed
# actions — and never widened from code or from a prompt. Changing behaviour means changing this file.
version: 1

metrics:
  # The metric definitions themselves live in SQL (metrics/sql). These are the constants that SQL reads, so a
  # tolerance is stated once and used everywhere.
  weight_tolerance: 0.02        # catch-weight items count as in full within 2% of ordered weight
  at_risk_days: 5               # lb_at_risk_within_5d: lots expiring within this many days

thresholds:
  # The default line for each metric, at the coarsest grain it is watched at. Every level here was set from the
  # measured distribution of the series it governs (roughly: warn at the worst ~5% of days, high at the worst
  # ~2%), because the first draft of this file was guesswork and the replay showed it: OTIF's "high" line of
  # 0.90 sat within a rounding error of the median, so the rule fired on half of all days and the brief was
  # noise. A threshold has to be drawn where the business actually operates. See docs/decisions.md B-006.
  otif_rate:           { warn: 0.82, high: 0.78, consecutive_days: 3, direction: down }
  fill_rate_weight:    { warn: 0.97, high: 0.95, consecutive_days: 2, direction: down }
  fill_rate_count:     { warn: 0.97, high: 0.95, consecutive_days: 2, direction: down }
  yield_variance_pct:  { warn_abs: 1.5, high_abs: 3.0, consecutive_days: 2, direction: both }
  inventory_age_days:  { warn: 6.0, high: 9.0, consecutive_days: 2, direction: up }
  lb_at_risk_within_5d: { warn: 3000, high: 3700, consecutive_days: 2, direction: up }
  open_backlog_lines:  { warn_z: 2.0, consecutive_days: 2, direction: up }
  # No HIGH line for backlog, and this one was measured rather than guessed. A queue is autocorrelated and
  # mechanically seasonal - nothing ships over a shutdown, so the backlog builds on its own - and the replay
  # showed a z-score cannot tell the difference: the seeded order surge (A6) peaks at z=2.81, while ordinary
  # swings reach 4.09, 4.39 and 5.04. Any line that admits the real one admits all of them. So backlog is
  # watched and reported at WARN, and nobody is woken for it until there is a measure that discriminates -
  # level against throughput, or a week-over-week comparison at the same weekday (docs/decisions.md B-006).

threshold_overrides:
  # A line drawn for the company is not the line for one lane. Each grain's rule is set from that grain's own
  # measured distribution; anything not named here inherits the default above.
  otif_plant:
    # Plants run at a median of 0.909 and dip to 0.75 in the worst 5% of days.
    otif_rate:        { warn: 0.75, high: 0.68, consecutive_days: 3 }
  otif_lane:
    # A single customer's lane ships a handful of lines a day, so its rate is mostly 0 or 1 and an absolute
    # line means nothing: the median lane-day is 1.00 and the 10th percentile is 0.00. The line for a lane is
    # drawn against its own normal instead, and read over a week rather than a day — a lane's seven-day rate
    # sitting 20 points below its own 28-day norm, two days running. That is a sentence an operations lead can
    # argue with, and it is the number they would judge the lane by. Volume floors still apply, measured over
    # the same week, so a lane that shipped twice cannot trip it.
    otif_rate:        { warn: null, high: null, warn_drop: 0.12, high_drop: 0.20,
                        window_days: 7, consecutive_days: 2 }
  fill_weight_group:
    # Plant x product group: worst 2% of days are below 0.952, worst 1% below 0.933.
    fill_rate_weight: { warn: 0.95, high: 0.93, consecutive_days: 3 }
  fill_count_group:
    fill_rate_count:  { warn: 0.95, high: 0.93, consecutive_days: 3 }

seasonality:
  # A5 is a real dip over a holiday week. A detector without these two settings will flag it HIGH and lose
  # precision; that is the point of the decoy.
  day_of_week_adjust: true
  baseline_days: 28
  known_holidays: ["2025-11-27", "2025-11-28", "2025-12-24", "2025-12-25", "2026-01-01",
                   "2026-05-25", "2026-07-03", "2026-07-04", "2026-09-07"]
  holiday_window_days: 2        # days either side of a holiday that inherit the holiday's allowance

detection:
  # The noise floors. A detector that flags everything is the same as a detector that flags nothing, so these
  # decide what is worth a leader's morning — and, like every other number here, they are the business's to
  # change, not an engineer's.
  min_baseline_points: 14       # fewer clean days than this in the baseline window → no opinion at all
  z: { warn: 2.0, high: 3.0 }   # day-of-week adjusted z-score from detect/baseline.py
  cusum: { k: 0.5, h: 5.0 }     # slack in standard deviations, and the decision interval
  holiday_max_severity: WARN    # a day inside a holiday window can never be an incident (the A5 decoy)
  statistical_max_severity: WARN
  # What separates "unusual" from "an incident". The statistical detectors - the day-over-day baseline and the
  # CUSUM change-point - can raise a finding to WARN on their own: something moved, somebody should look. Only
  # a breach of a line in this file makes it HIGH, because only this file says what the business considers
  # unacceptable. Measured: without this rule the statistical detectors produced 322 of the 365 HIGH flags in
  # the first replay, nearly all of them real movements that nobody needed woken up for (docs/decisions.md
  # B-006). Statistics say a thing changed; policy says it matters.
  min_std:
    # A floor under the standard deviation, so a series that has been flat for a month cannot produce an
    # enormous z on its first ordinary wobble.
    default: 0.0
    otif_rate: 0.02
    fill_rate_weight: 0.004
    fill_rate_count: 0.004
    yield_variance_pct: 0.3
    inventory_age_days: 0.2
    lb_at_risk_within_5d: 50.0
    open_backlog_lines: 5.0
  min_volume:
    # Lines, pounds or open lines behind the number. Below this the rate is arithmetic, not information.
    default: 0.0
    otif_rate: 8
    fill_rate_weight: 8
    fill_rate_count: 8
    yield_variance_pct: 1000
    inventory_age_days: 1000
    lb_at_risk_within_5d: 1000
  min_magnitude:
    # How far the metric must have moved from its own expectation before the movement is worth saying out loud.
    default: 0.0
    otif_rate: 0.05
    fill_rate_weight: 0.02
    fill_rate_count: 0.02
    yield_variance_pct: 1.0
    inventory_age_days: 1.0
    lb_at_risk_within_5d: 500.0
    open_backlog_lines: 40.0

allowed_actions:
  # anomaly type → the action types a person may be asked to approve. Anything else is rejected in code before
  # approval is requested, and logged as a policy violation.
  otif_drop:         [jira_ticket, internal_update]
  fill_rate_drop:    [jira_ticket, investigation]
  yield_variance:    [investigation]
  inventory_at_risk: [internal_update, jira_ticket]
  backlog_build:     [jira_ticket, internal_update]

limits:
  max_actions_per_brief: 5
  suppress_if_open_ticket_days: 7   # same anomaly, open ticket within this window → no duplicate action
  max_items_per_brief: 6

freshness:
  # Gold older than this is disclosed at the top of the brief and marks affected items.
  stale_after_days: 1
